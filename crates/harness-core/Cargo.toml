[package]
name = "harness-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cordis = { git = "https://github.com/y0usaf/cordis-rs", rev = "cf63158e1dca7f75848ee09d0c583a86fd741f80" }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
uuid = { version = "1", default-features = false, features = ["v4"] }
vt100 = "0.16"

[features]
omp = []

[build-dependencies]
wat = "1"
