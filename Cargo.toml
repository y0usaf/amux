[package]
name = "pi-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
anyhow = "1"
chrono = "0.4"
env_logger = "0.11"
fontdue = "0.9"
log = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"
winit = "0.30"
